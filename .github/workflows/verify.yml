name: Verify proposal site

# The "observe" step of the loop, automated on every push/PR.
# Green here is the stopping condition; red is the signal to keep working.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run verification loop
        run: python3 scripts/verify.py
